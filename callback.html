<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorization – HAJR Quran</title></head>
<body style="font-family:sans-serif;max-width:760px;margin:auto;padding:24px;text-align:center"><h1>تم التفويض ✅</h1><p>انسخ الرابط كامل والصقه في نافذة الإعداد</p>
<p>code: <b id="c"></b><br>state: <b id="s"></b></p><textarea id="u" rows="5" style="width:100%" readonly></textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('u').value);this.textContent='Copied ✓'">Copy</button>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')||'-';document.getElementById('s').textContent=p.get('state')||'-';document.getElementById('u').value=location.href;</script></body></html>
